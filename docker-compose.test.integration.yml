# Node.js local integration testing docker-compose file
services:
  # https://hub.docker.com/_/postgres
  postgres:
    container_name: ${DIR}_postgres_test
    image: postgres:${POSTGRES_VER}
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB} # database
      POSTGRES_USER: ${POSTGRES_USER} # root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # Passw0rd!
    ports:
      - ${POSTGRES_PORT}:5432
    expose:
      - ${POSTGRES_PORT}
  # https://hub.docker.com/_/redis
  redis:
    container_name: ${DIR}_redis_test
    image: redis:${REDIS_VER}
    env_file:
      - .env
    environment:
      REDIS_PASS: ${REDIS_PASSWORD} # Passw0rd!
    ports:
      - ${REDIS_PORT}:6379
    expose:
      - ${REDIS_PORT}
    command: sh -c 'redis-server --requirepass "$REDIS_PASSWORD"'
